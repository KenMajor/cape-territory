<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cape Territory</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1220">
<meta name="description" content="Door-to-door solar targeting map for Mid-Cape (Barnstable, Yarmouth, Dennis).">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map" role="application" aria-label="Territory map"></div>

<div class="topbar">
  <div class="brand">CAPE <b>TERRITORY</b></div>
  <div class="topbtns">
    <button id="btn-base" class="rbtn" aria-label="Switch basemap">SAT</button>
    <button id="btn-locate" class="rbtn" aria-label="Locate me">◎</button>
  </div>
</div>

<div id="loading" class="loading" hidden>Loading…</div>

<div class="bottom">
  <div id="legend" class="legend" role="button" tabindex="0" aria-label="Legend, tap to expand">
    <div class="legend-line">
      <span id="legend-title" class="legend-title">Attack Score</span>
      <span id="legend-swatches" class="legend-swatches"></span>
      <span class="legend-caret">▾</span>
    </div>
    <div id="legend-detail" class="legend-detail" hidden></div>
  </div>

  <div class="bar">
    <button id="btn-layers" class="bbtn wide"><span class="lbl">LAYER</span><span id="layer-name" class="val">Attack Score</span></button>
    <button id="btn-scorecard" class="bbtn"><span class="lbl">TOWN</span><span class="val">Scorecard</span></button>
    <button id="btn-copy" class="bbtn"><span class="lbl">COPY</span><span class="val">Progress</span></button>
  </div>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-head">
    <div id="sheet-title" class="sheet-title"></div>
    <button id="sheet-close" class="rbtn small" aria-label="Close">✕</button>
  </div>
  <div id="sheet-body" class="sheet-body"></div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="app.js"></script>
</body>
</html>
